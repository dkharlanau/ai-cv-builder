name: Deploy reference profile to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run verify
      - uses: actions/configure-pages@v6
      - name: Stage verified ARWP profile and discovery
        run: node scripts/stage-arwp.mjs dist
      - name: Add Goose ARWP Proof Mark
        run: node scripts/inject-goose-proof-mark.mjs dist
      - name: Add consent-aware portfolio analytics
        run: node scripts/inject-portfolio-analytics.mjs dist
      - name: Verify Proof Mark in final artifact
        run: grep -q 'data-goose-arwp-proof-mark="0.1"' dist/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
